name: Publish macOS release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify app
        run: sh scripts/package-release.sh
      - name: Create downloadable ZIP
        run: ditto -c -k --sequesterRsrc --keepParent "release/Isola Clipboard.app" "IsolaClipboard-macOS-arm64.zip"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0.0 "IsolaClipboard-macOS-arm64.zip" --title "Isola Clipboard v1.0.0" --notes "First public macOS Apple Silicon build. Download the ZIP, extract it, and move Isola Clipboard.app to Applications. This build is ad-hoc signed and not Apple-notarized; macOS may require manually allowing the app in System Settings > Privacy & Security. Clipboard history stays in memory." --target "${GITHUB_SHA}"
